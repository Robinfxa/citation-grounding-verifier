[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "citation-grounding-verifier"
version = "0.1.0"
description = "Context-only claim verification with exact citations and reproducible evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "uvicorn>=0.32,<1",
  "python-dotenv>=1,<2",
  "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
grounding-eval = "grounding_eval.cli:main"
grounding-auth = "grounding.codex_auth:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/grounding", "src/grounding_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["references", ".agents", ".codex", "Agent-init"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
